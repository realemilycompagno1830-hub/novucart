<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Novucart</title>

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f8fafc; color: #0f172a; }

    /* ANNOUNCEMENT BAR */
    .announcement-bar { background: #000; color: #fff; text-align: center; padding: 8px 16px; font-size: 0.85rem; font-weight: 600; }

    /* NAVBAR */
    header { background: #fff; border-bottom: 1px solid #e2e8f0; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; }
    .brand-logo { font-size: 1.4rem; font-weight: 800; text-decoration: none; color: #0f172a; }

    /* HERO SECTION */
    .hero { background: #1e293b; color: #fff; padding: 60px 24px; text-align: center; }
    .hero h1 { font-size: 2.2rem; margin-bottom: 12px; }

    /* PRODUCT GRID */
    .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
    .products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 24px; }
    
    .product-card { background: #fff; border-radius: 12px; border: 1px solid #e2e8f0; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; transition: transform 0.2s; }
    .product-card:hover { transform: translateY(-4px); }
    .product-image { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; margin-bottom: 12px; }
    .product-title { font-weight: 700; font-size: 1.05rem; margin-bottom: 6px; }
    .product-price { font-weight: 800; color: #FF6B1F; font-size: 1.1rem; margin-bottom: 12px; }
    
    .btn-buy { background: #000; color: #fff; border: none; padding: 10px; border-radius: 6px; font-weight: 700; width: 100%; cursor: pointer; }
    .btn-buy:hover { background: #334155; }
  </style>
</head>
<body>

  <!-- TOP ANNOUNCEMENT -->
  <div class="announcement-bar" id="topAnnouncement">📢 Welcome to Novucart!</div>

  <!-- NAVIGATION -->
  <header>
    <a href="index.html" class="brand-logo" id="siteLogo">Novucart</a>
    <a href="admin.html" style="color: #64748b; text-decoration: none; font-size: 0.85rem; font-weight: 600;">Admin Area</a>
  </header>

  <!-- HERO BANNER -->
  <div class="hero">
    <h1 id="heroHeadline">Discover Extraordinary Products</h1>
  </div>

  <!-- PRODUCTS CONTAINER -->
  <div class="container">
    <h2 style="margin-bottom: 20px;">Catalog</h2>
    <div class="products-grid" id="publicProductGrid">
      <p>Loading products...</p>
    </div>
  </div>

<script>
  // FIREBASE CONFIGURATION
  const firebaseConfig = {
    apiKey: "YOUR_API_KEY",
    authDomain: "YOUR_AUTH_DOMAIN",
    projectId: "YOUR_PROJECT_ID",
    storageBucket: "YOUR_STORAGE_BUCKET",
    messagingSenderId: "YOUR_SENDER_ID",
    appId: "YOUR_APP_ID"
  };

  let db;
  try {
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
    db = firebase.firestore();
  } catch(e) {}

  document.addEventListener('DOMContentLoaded', () => {
    applySettings();
    fetchStoreProducts();
  });

  function applySettings() {
    const settings = JSON.parse(localStorage.getItem('novucart_settings')) || {};
    if(settings.siteTitle) {
      document.getElementById('pageTitle').innerText = settings.siteTitle;
      document.getElementById('siteLogo').innerText = settings.siteTitle;
    }
    if(settings.announcement) document.getElementById('topAnnouncement').innerText = settings.announcement;
    if(settings.heroTitle) document.getElementById('heroHeadline').innerText = settings.heroTitle;
  }

  function fetchStoreProducts() {
    const grid = document.getElementById('publicProductGrid');
    if (db && firebaseConfig.apiKey !== "YOUR_API_KEY") {
      db.collection('products').get().then(snapshot => {
        if(snapshot.empty) {
          grid.innerHTML = '<p>No products available right now.</p>';
          return;
        }
        grid.innerHTML = '';
        snapshot.forEach(doc => {
          const p = doc.data();
          grid.innerHTML += renderProductCard(p);
        });
      }).catch(() => fetchLocalProducts());
    } else {
      fetchLocalProducts();
    }
  }

  function fetchLocalProducts() {
    const grid = document.getElementById('publicProductGrid');
    const products = JSON.parse(localStorage.getItem('novucart_products')) || [];
    if(products.length === 0) {
      grid.innerHTML = '<p>No products available right now.</p>';
      return;
    }
    grid.innerHTML = products.map(p => renderProductCard(p)).join('');
  }

  function renderProductCard(p) {
    const settings = JSON.parse(localStorage.getItem('novucart_settings')) || {};
    const checkoutUrl = settings.cardPaymentUrl || '#';
    return `
      <div class="product-card">
        <div>
          <img src="${p.image || 'https://via.placeholder.com/200'}" class="product-image" alt="${p.title}">
          <div class="product-title">${p.title}</div>
          <div class="product-price">$${parseFloat(p.price).toFixed(2)}</div>
        </div>
        <a href="${checkoutUrl}" target="_blank" style="text-decoration:none;">
          <button class="btn-buy">Buy Now</button>
        </a>
      </div>
    `;
  }
</script>

</body>
</html>
