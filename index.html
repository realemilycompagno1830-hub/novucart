<!DOCTYPE html>
<html lang="en"
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="pageTitle">Novucart</title>
  <link rel="stylesheet" href="style.css">

  <!-- FIREBASE SDKs -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
</head>
<body>

  <!-- TOP ANNOUNCEMENT BAR -->
  <div class="announcement-bar" id="topAnnouncement">📢 Welcome to Novucart!</div>

  <!-- NAVIGATION HEADER -->
  <header>
    <a href="index.html" class="brand-logo" id="siteLogo">Novucart</a>
    <div class="nav-links">
      <a href="#" id="whatsappLink" target="_blank" style="display:none;">WhatsApp Support</a>
      <a href="admin.html">Admin Area</a>
    </div>
  </header>

  <!-- HERO SECTION -->
  <div class="hero">
    <h1 id="heroHeadline">Discover Extraordinary Products</h1>
  </div>

  <!-- CATALOG GRID -->
  <div class="container">
    <div class="products-grid" id="publicProductGrid">
      <p style="text-align:center; color:#86868b; grid-column: 1/-1;">Loading products...</p>
    </div>
  </div>

  <!-- PAY ON DELIVERY MODAL -->
  <div class="modal-overlay" id="podModal">
    <div class="modal-content">
      <h3 style="margin-bottom: 12px; font-size: 1.25rem;">Pay on Delivery</h3>
      <p style="font-size:0.88rem; color:#86868b; margin-bottom:16px;">Complete your order details below.</p>
      
      <form id="podForm" onsubmit="handlePodSubmit(event)">
        <input type="hidden" id="podItemTitle">
        <input type="hidden" id="podItemPrice">
        
        <div style="margin-bottom: 12px;">
          <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">Full Name</label>
          <input type="text" id="custName" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #d2d2d7;">
        </div>
        
        <div style="margin-bottom: 12px;">
          <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">Phone Number</label>
          <input type="tel" id="custPhone" required style="width:100%; padding:10px; border-radius:8px; border:1px solid #d2d2d7;">
        </div>

        <div style="margin-bottom: 20px;">
          <label style="display:block; font-size:0.8rem; font-weight:600; margin-bottom:4px;">Delivery Address</label>
          <textarea id="custAddress" required rows="3" style="width:100%; padding:10px; border-radius:8px; border:1px solid #d2d2d7;"></textarea>
        </div>

        <button type="submit" class="btn-primary">Confirm Order</button>
        <button type="button" class="btn-secondary" onclick="closePodModal()">Cancel</button>
      </form>
    </div>
  </div>

  <!-- POP-UP PROMO BANNER -->
  <div class="promo-banner" id="promoBanner">
    <button onclick="closeBanner()" style="position:absolute; top:8px; right:12px; background:none; border:none; font-size:1.1rem; cursor:pointer; color:#86868b;">✕</button>
    <h4 id="bannerTitleText" style="margin-bottom:6px; font-size:1rem; color:#1d1d1f;"></h4>
    <p id="bannerDescText" style="font-size:0.85rem; color:#86868b; margin-bottom:12px;"></p>
    <a id="bannerBtnLink" href="#" target="_blank" class="btn-primary" style="padding:8px 16px; font-size:0.85rem;"></a>
  </div>

  <script src="app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      initStorefront();
    });
  </script>
</body>
</html>
