<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novucart | Admin CMS Dashboard</title>
  <style>
    :root {
      --admin-bg: #F8FAFC; --admin-sidebar: #0F172A; --admin-card: #FFFFFF;
      --admin-accent: #4F46E5; --admin-text: #1E293B; --admin-border: #E2E8F0;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, sans-serif; }
    body { background: var(--admin-bg); color: var(--admin-text); }
    .admin-layout { display: flex; min-height: 100vh; }
    
    .admin-sidebar { width: 260px; background: var(--admin-sidebar); color: #FFF; padding: 24px 16px; display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header h2 { font-size: 1.2rem; margin-bottom: 24px; }
    .sidebar-nav { display: flex; flex-direction: column; gap: 8px; flex: 1; }
    .nav-tab { background: transparent; border: none; color: #94A3B8; padding: 12px 16px; border-radius: 8px; text-align: left; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .nav-tab.active { background: var(--admin-accent); color: #FFF; }
    .btn-outline-light { border: 1px solid #334155; color: #E2E8F0; text-decoration: none; display: inline-flex; justify-content: center; padding: 10px; border-radius: 8px; font-size: 0.85rem; }

    .admin-main { flex: 1; display: flex; flex-direction: column; }
    .admin-topbar { background: #FFF; border-bottom: 1px solid var(--admin-border); padding: 20px 32px; display: flex; justify-content: space-between; align-items: center; }
    .admin-content-area { padding: 32px; max-width: 1000px; width: 100%; }
    .admin-card { background: #FFF; border: 1px solid var(--admin-border); border-radius: 12px; padding: 24px; margin-bottom: 24px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .admin-card h3 { font-size: 1.1rem; margin-bottom: 16px; }

    .form-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 18px; }
    .span-2 { grid-column: span 2; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    .form-group label { font-size: 0.85rem; font-weight: 600; }
    .form-group input, .form-group textarea { padding: 10px 14px; border: 1px solid var(--admin-border); border-radius: 6px; font-size: 0.9rem; }

    .btn { padding: 10px 18px; border-radius: 6px; font-size: 0.85rem; font-weight: 600; border: none; cursor: pointer; }
    .btn-save-primary { background: #16A34A; color: #FFF; font-size: 0.95rem; }
    .btn-secondary { background: #F1F5F9; border: 1px solid var(--admin-border); }
    .btn-danger { background: #FEE2E2; color: #DC2626; border: 1px solid #FCA5A5; }

    .dynamic-items-list { display: flex; flex-direction: column; gap: 12px; }
    .item-row { display: flex; align-items: center; gap: 12px; background: #F8FAFC; padding: 12px; border: 1px solid var(--admin-border); border-radius: 8px; }
    .item-row input { flex: 1; padding: 8px 12px; border: 1px solid var(--admin-border); border-radius: 6px; }

    @media (max-width: 800px) {
      .admin-layout { flex-direction: column; }
      .admin-sidebar { width: 100%; }
      .sidebar-nav { flex-direction: row; overflow-x: auto; }
      .form-grid { grid-template-columns: 1fr; }
      .span-2 { grid-column: span 1; }
    }
  </style>
</head>
<body>

  <div class="admin-layout">
    <aside class="admin-sidebar">
      <div class="sidebar-header">
        <h2>Novucart CMS</h2>
      </div>
      <nav class="sidebar-nav">
        <button class="nav-tab active" data-tab="tab-header">Header & Notice</button>
        <button class="nav-tab" data-tab="tab-hero">Hero Backgrounds</button>
        <button class="nav-tab" data-tab="tab-products">Manage Products</button>
        <button class="nav-tab" data-tab="tab-footer">Footer Content</button>
        <button class="nav-tab" data-tab="tab-promo">Side Promo Box</button>
      </nav>
      <div style="margin-top:20px;">
        <a href="index.html" target="_blank" class="btn-outline-light" style="width:100%;">Preview Website</a>
      </div>
    </aside>

    <main class="admin-main">
      <header class="admin-topbar">
        <h1 id="active-tab-title">Header & Notice</h1>
        <button id="save-all-changes-btn" class="btn btn-save-primary">Save All Changes</button>
      </header>

      <div class="admin-content-area">

        <!-- TAB 1: HEADER -->
        <section class="admin-card tab-content active" id="tab-header">
          <h3>Announcement Bar & Brand Info</h3>
          <div class="form-grid">
            <div class="form-group span-2">
              <label>Top Announcement Text</label>
              <input type="text" id="cfg-announcement-text">
            </div>
            <div class="form-group">
              <label>Brand Name</label>
              <input type="text" id="cfg-brand-name">
            </div>
            <div class="form-group">
              <label>Brand Logo URL (Optional)</label>
              <input type="text" id="cfg-brand-logo-url">
            </div>
            <div class="form-group">
              <label>Header Contact Button Text</label>
              <input type="text" id="cfg-header-contact-text">
            </div>
            <div class="form-group">
              <label>WhatsApp Contact Number</label>
              <input type="text" id="cfg-whatsapp-number">
            </div>
          </div>
        </section>

        <!-- TAB 2: HERO BACKGROUNDS -->
        <section class="admin-card tab-content" id="tab-hero">
          <h3>Hero Section Text</h3>
          <div class="form-grid">
            <div class="form-group span-2">
              <label>Main Headline</label>
              <input type="text" id="cfg-hero-headline">
            </div>
            <div class="form-group span-2">
              <label>Subheadline / Tagline</label>
              <input type="text" id="cfg-hero-subtext">
            </div>
            <div class="form-group">
              <label>Hero Button Text</label>
              <input type="text" id="cfg-hero-btn-text">
            </div>
          </div>

          <hr style="margin: 24px 0; border: none; border-top: 1px solid #E2E8F0;">

          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h3>Hero Background Slides</h3>
            <button class="btn btn-secondary" id="add-hero-slide-btn">+ Add Image Slide</button>
          </div>

          <div id="hero-slides-container" class="dynamic-items-list"></div>
        </section>

        <!-- TAB 3: PRODUCTS -->
        <section class="admin-card tab-content" id="tab-products">
          <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
            <h3>Product Collection</h3>
            <button class="btn btn-secondary" id="add-new-product-btn">+ Add Product</button>
          </div>
          <div id="products-admin-list" class="dynamic-items-list"></div>
        </section>

        <!-- TAB 4: FOOTER -->
        <section class="admin-card tab-content" id="tab-footer">
          <h3>Footer Columns & Contact Details</h3>
          <div class="form-grid">
            <div class="form-group">
              <label>Footer Brand Name</label>
              <input type="text" id="cfg-footer-brand-title">
            </div>
            <div class="form-group span-2">
              <label>Footer Description</label>
              <textarea id="cfg-footer-brand-desc" rows="2"></textarea>
            </div>
            <div class="form-group">
              <label>Support Email Address</label>
              <input type="email" id="cfg-footer-email">
            </div>
            <div class="form-group span-2">
              <label>Footer Copyright Text</label>
              <input type="text" id="cfg-footer-copyright">
            </div>
          </div>
        </section>

        <!-- TAB 5: SIDE PROMO -->
        <section class="admin-card tab-content" id="tab-promo">
          <h3>Pop-up Promotional Box</h3>
          <div class="form-grid">
            <div class="form-group span-2">
              <label><input type="checkbox" id="cfg-promo-ad-enable"> <strong>Enable Side Promo Box</strong></label>
            </div>
            <div class="form-group">
              <label>Ad Headline</label>
              <input type="text" id="cfg-promo-ad-heading">
            </div>
            <div class="form-group">
              <label>Ad Image URL (Optional)</label>
              <input type="text" id="cfg-promo-ad-img">
            </div>
            <div class="form-group span-2">
              <label>Ad Body Text</label>
              <textarea id="cfg-promo-ad-body" rows="2"></textarea>
            </div>
            <div class="form-group">
              <label>Button Label</label>
              <input type="text" id="cfg-promo-ad-btn-text">
            </div>
            <div class="form-group">
              <label>Button Redirect Link</label>
              <input type="text" id="cfg-promo-ad-btn-link">
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
