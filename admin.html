<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Novucart Admin</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #F8FAFC; color: #0F172A; padding: 20px; }
    .admin-container { max-width: 900px; margin: 0 auto; background: #FFF; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
    h1 { font-size: 1.5rem; margin-bottom: 20px; color: #1E293B; border-bottom: 2px solid #E2E8F0; padding-bottom: 10px; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-weight: 600; font-size: 0.88rem; margin-bottom: 6px; color: #334155; }
    input[type="text"], input[type="email"], textarea { width: 100%; padding: 10px 14px; border: 1px solid #CBD5E1; border-radius: 6px; font-size: 0.95rem; background: #F8FAFC; }
    input:focus, textarea:focus { outline: none; border-color: #4F46E5; background: #FFF; }
    .btn-save { background: #FF6B1F; color: white; border: none; padding: 12px 24px; font-size: 1rem; font-weight: 700; border-radius: 8px; cursor: pointer; margin-top: 10px; }
    .btn-save:hover { background: #E55A10; }
  </style>
</head>
<body>

<div class="admin-container">
  <h1>⚙️ Novucart Site & Payment Configuration</h1>

  <form id="adminForm">
    <div class="form-group">
      <label>Custom Card Payment Link (Stripe/Paystack/Flutterwave/PayPal)</label>
      <input type="text" id="cardPaymentUrl" placeholder="https://checkout.stripe.com/pay/...">
    </div>

    <div class="form-group">
      <label>Site Title</label>
      <input type="text" id="siteTitle" placeholder="Novucart">
    </div>

    <div class="form-group">
      <label>Top Announcement Bar Text</label>
      <input type="text" id="announcement" placeholder="📢 Welcome to Novucart!">
    </div>

    <div class="form-group">
      <label>Hero Headline</label>
      <input type="text" id="heroTitle" placeholder="Discover Extraordinary Products">
    </div>

    <div class="form-group">
      <label>Store Email (Receives Pay-on-Delivery Orders)</label>
      <input type="email" id="storeEmail" placeholder="buycheapcarsonline@gmail.com">
    </div>

    <div class="form-group">
      <label>WhatsApp Contact Link</label>
      <input type="text" id="whatsapp" placeholder="https://wa.me/1234567890">
    </div>

    <button type="button" class="btn-save" onclick="saveAdminSettings()">Save Settings & Payment Link</button>
  </form>
</div>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    const settings = JSON.parse(localStorage.getItem('novucart_settings')) || {};
    if(settings.cardPaymentUrl) document.getElementById('cardPaymentUrl').value = settings.cardPaymentUrl;
    if(settings.siteTitle) document.getElementById('siteTitle').value = settings.siteTitle;
    if(settings.announcement) document.getElementById('announcement').value = settings.announcement;
    if(settings.heroTitle) document.getElementById('heroTitle').value = settings.heroTitle;
    if(settings.storeEmail) document.getElementById('storeEmail').value = settings.storeEmail;
    if(settings.whatsapp) document.getElementById('whatsapp').value = settings.whatsapp;
  });

  function saveAdminSettings() {
    const settings = {
      cardPaymentUrl: document.getElementById('cardPaymentUrl').value,
      siteTitle: document.getElementById('siteTitle').value,
      announcement: document.getElementById('announcement').value,
      heroTitle: document.getElementById('heroTitle').value,
      storeEmail: document.getElementById('storeEmail').value,
      whatsapp: document.getElementById('whatsapp').value,
    };

    localStorage.setItem('novucart_settings', JSON.stringify(settings));
    alert('Settings saved successfully!');
  }
</script>

</body>
</html>
